<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relogio da Banana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id = "nav">
        <nav>
            <div class="logo">
                <img src="src/Sheets/Images/banana.png" alt="">
                <h1>Relogio da Ban<span>ana</span></h1>
            </div>
        </nav>
    </header>

    <main>
        <div class = "escolha_dia_slider" id = "dia_slider">
            <p>Dia 1</p>
            <label class="switch">
                <input type="checkbox" id="check-day">
                <span class="slider"></span>
            </label>
            <p>Dia 2</p>
        </div>

        <div class = "titulo"></div>
        <div class="contagem">
            <ul class="horario_quadro">

            </ul>
        </div>

        <div class="selecao_segundos_start">
            <h1>Quantos segundos para começar?</h1>
            <input type="text" value="5" name="sec_to_start" id="sec_to_start">
        </div>

        <button id="start" onclick="start_clock()">Começar</button>
    </main>

    <script src="script.js"></script>
</body>

</html>
